name: Mirror oversized files (one-time)

# One-time helper: the two largest mirrored files exceed the GitHub Contents
# API request-size limit, so they cannot be uploaded from outside. This
# workflow downloads them from upstream inside the runner (where git push
# works with the workflow token) and commits them. Delete this file after it
# has run once successfully.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Download oversized files from upstream and verify sha256
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            "https://github.com/FongMi/Release/releases/download/module/runtime-nodejs-1.0.7-arm64-v8a.apk" \
            --output "module/runtime-nodejs-1.0.7-arm64-v8a.apk"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            "https://github.com/FongMi/Release/releases/download/5.8.7/mobile-arm64_v8a.apk" \
            --output "build/mobile-arm64_v8a.apk"
          echo "bb7d48fe76ed119e2631fb99fc692ed831ecea385019c6e7bf7c9dd666f7ab07  module/runtime-nodejs-1.0.7-arm64-v8a.apk" | sha256sum -c -
          echo "449867339299838303b5be19c92288756e3d88bf0ea3f8a9dab1abb75696d85a  build/mobile-arm64_v8a.apk" | sha256sum -c -

      - name: Commit mirrored files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module/runtime-nodejs-1.0.7-arm64-v8a.apk build/mobile-arm64_v8a.apk
          git commit -m "mirror oversized upstream files (nodejs arm64, mobile arm64)" || echo "nothing to commit"
          git push origin main
